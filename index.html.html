const MENU = [['Dashboard', , 'grid'], ['Motoristas', 'motoristas', 'user'], ['Veículos', 'veiculos', 'truck'], ['Lojas', 'lojas', 'store'], ['Rotas', 'rotas', 'route'], ['Abastecimentos', 'abastecimentos', 'fuel'], ['Inspeções', 'inspecoes', 'clip'], ['Manutenção', 'manutencoes', 'wrench'], ['Expedições', 'expedicoes', 'pkg']];

const LAB = { motoristas: r => r.nomeCompleto, veiculos: r => `${r.nomeVeiculo} (${r.placa})`, lojas: r => r.nomeLoja, rotas: r => r.nomeRota };
const nm = (c, id) => D[c]?.[id] ? LAB[c](D[c][id]) : '—';
const fl = (col, k) => E[col].f.find(f => f[0] === k) || [];
const agora = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
const dt = d => d ? d.split('-').reverse().join('/') : '—';

/* REGRAS DE NEGÓCIO E PERSISTÊNCIA */
const recalc = id => {
  if (!id || !D.veiculos[id]) return;
  const man = Object.values(D.manutencoes || {}).some(m => m.idVeiculo === id && m.statusManutencao === 'Aberta');
  const ex = Object.values(D.expedicoes || {}).some(x => x.idVeiculo === id && x.statusExpedicao === 'Em rota');
  D.veiculos[id].status = man ? 'Manutenção' : ex ? 'Em uso' : 'Disponível';
};

const salvar = (col, id, v) => {
  const old = id ? D[col][id] : null;
  const key = id || `${col.slice(0, 3)}_${Date.now()}`;
  
  if (col === 'inspecoes') {
    const a = IN.map(k => v[k]);
    v.qtdAtencao = a.filter(x => x === 'Atenção').length;
    v.qtdCritico = a.filter(x => x === 'Crítico').length;
  }
  if (col === 'abastecimentos') {
    const l = Number(v.litros || 0), val = Number(v.valor || 0);
    v.cotacao = l > 0 ? Number((val / l).toFixed(2)) : 0;
  }
  if (col === 'expedicoes' && v.kmChegada !== undefined) {
    if (v.kmChegada < v.kmSaida) throw new Error('Quilometragem inválida.');
    v.kmRodado = v.kmChegada - v.kmSaida;
  }
  if (!old) v.criadoEm = Date.now();
  if (col === 'veiculos' && !old) v.status = 'Disponível';
  
  D[col][key] = v;
  
  if (col === 'manutencoes' || col === 'expedicoes') {
    recalc(v.idVeiculo);
    if (old && old.idVeiculo !== v.idVeiculo) recalc(old.idVeiculo);
  }
  
  saveDB();
  toast(col === 'expedicoes' ? 'Expedição atualizada.' : 'Registro salvo.');
};

const novaExp = () => form('expedicoes', null, ['idMotorista', 'idRota', 'idVeiculo', 'kmSaida', 'observacoesSaida'], 'Nova expedição', v => {
  if (D.motoristas[v.idMotorista]?.status !== 'Ativo') throw new Error('Motorista inativo.');
  if (D.veiculos[v.idVeiculo]?.status !== 'Disponível') throw new Error('Veículo indisponível.');
  
  D.veiculos[v.idVeiculo].status = 'Em uso';
  const t = Date.now();
  const key = `exp_${t}`;
  D.expedicoes[key] = { ...v, criadoEm: t, dataHoraSaida: t, statusExpedicao: 'Em rota' };
  saveDB();
  toast('Expedição criada.');
}, { disp: 1 });

const fim = id => {
  const e = D.expedicoes[id];
  form('expedicoes', id, ['kmChegada', 'observacoesRetorno'], 'Finalizar expedição', v => {
    if (v.kmChegada < e.kmSaida) throw new Error('Quilometragem inválida.');
    D.expedicoes[id] = { ...e, ...v, kmRodado: v.kmChegada - e.kmSaida, dataHoraChegada: Date.now(), statusExpedicao: 'Finalizada' };
    recalc(e.idVeiculo);
    saveDB();
    toast('Expedição finalizada.');
  });
};

/* FORMULÁRIO GENÉRICO */
const inp = ([k, l, t = 'text', o], v, ctx) => {
  if (t === 'sel') return `<select name="${k}" class="${IC}"><option value=""></option>${o.map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  if (t === 'chk_dias') {
    const sel = Array.isArray(v) ? v : (v ? String(v).split(', ') : []);
    return `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 border border-gray-300 rounded-xl p-3 bg-white">${DIAS.map(d => `<label class="inline-flex items-center gap-1.5 text-xs text-gray-700 cursor-pointer"><input type="checkbox" name="${k}" value="${d}" ${sel.includes(d) ? 'checked' : ''} class="rounded border-gray-300 text-brand focus:ring-brand"> ${d}</label>`).join('')}</div>`;
  }
  if (t === 'chk_lojas') {
    const sel = Array.isArray(v) ? v : (v ? String(v).split(', ') : []);
    const lojasList = Object.entries(D.lojas || {});
    if (!lojasList.length) return `<div class="text-xs text-gray-500 italic">Cadastre lojas primeiro.</div>`;
    return `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 border border-gray-300 rounded-xl p-3 bg-white max-h-40 overflow-y-auto">${lojasList.map(([id, r]) => `<label class="inline-flex items-center gap-1.5 text-xs text-gray-700 cursor-pointer"><input type="checkbox" name="${k}" value="${id}" ${sel.includes(id) ? 'checked' : ''} class="rounded border-gray-300 text-brand focus:ring-brand"> ${esc(r.nomeLoja)} (${esc(r.cidade)})</label>`).join('')}</div>`;
  }
  if (t === 'file') return `<input name="${k}_file" id="${k}_file" type="file" accept="image/*" class="${IC}"><input type="hidden" name="${k}" value="${esc(v)}">${v ? `<div class="mt-1 text-xs text-green-700 font-medium">✓ Imagem já anexada</div>` : ''}`;
  if (t.startsWith('ref:')) {
    const cn = t.slice(4);
    return `<select name="${k}" class="${IC}"><option value=""></option>${Object.entries(D[cn] || {}).filter(([i, r]) => !(ctx.disp && cn === 'veiculos' && r.status !== 'Disponível') && (ctx.todos || !(cn === 'motoristas' && r.status === 'Inativo' && i !== v))).map(([i, r]) => `<option value="${i}" ${i === v ? 'selected' : ''}>${esc(LAB[cn](r))}</option>`).join('')}</select>`;
  }
  if (t === 'textarea') return `<textarea name="${k}" rows="2" class="${IC}">${esc(v)}</textarea>`;
  return `<input name="${k}" type="${t}" ${t === 'number' ? 'step="any"' : ''} value="${esc(v ?? (t === 'datetime-local' ? agora() : ''))}" class="${IC}">`;
};

const form = (col, id, keys, title, onSave, ctx = {}) => {
  const rec = id ? D[col][id] : {}, fs = keys.map(k => fl(col, k));
  modal(`<h3 class="text-lg font-semibold mb-4">${title}</h3><form id="fm" class="grid sm:grid-cols-2 gap-3">${fs.map(f => `<label class="text-sm ${['textarea', 'chk_dias', 'chk_lojas'].includes(f[2]) ? 'sm:col-span-2' : ''}"><span class="block mb-1 text-gray-600">${f[1]}</span>${inp(f, rec[f[0]], ctx)}</label>`).join('')}<div class="sm:col-span-2 flex justify-end gap-2 pt-2"><button type="button" class="${G}" data-a="x">Cancelar</button><button class="${B}">Salvar</button></div></form>`);
  
  $('#fm').onsubmit = async e => {
    e.preventDefault();
    const v = {};
    for (const f of fs) {
      const k = f[0];
      if (f[2] === 'chk_dias' || f[2] === 'chk_lojas') {
        const cks = Array.from(e.target.querySelectorAll(`input[name="${k}"]:checked`)).map(c => c.value);
        if (!cks.length) return toast(`Selecione ao menos um item de ${f[1]}.`, 0);
        v[k] = cks.join(', ');
        continue;
      }
      if (f[2] === 'file') {
        const fi = e.target[`${k}_file`]?.files[0];
        if (fi) {
          v[k] = await new Promise(res => {
            const r = new FileReader();
            r.onload = ev => res(ev.target.result);
            r.readAsDataURL(fi);
          });
        } else {
          v[k] = rec[k] || '';
        }
        continue;
      }
      let x = e.target[k]?.value?.trim() ?? '';
      if (x === '' && f[2] !== 'textarea' && !f[4]) return toast('Preencha o campo: ' + f[1], 0);
      if (f[2] === 'number' && x !== '') {
        x = Number(x);
        if (isNaN(x) || x < 0) return toast(/^km|odometro/.test(k) ? 'Quilometragem inválida.' : 'Valor inválido.', 0);
      }
      v[k] = x;
    }
    try {
      (onSave || (val => salvar(col, id, val)))(v, id);
      modal();
    } catch (er) {
      toast(er.message || 'Erro ao salvar.', 0);
    }
  };
};

const conf = (msg, fn, ok = 'Registro excluído.') => {
  modal(`<p class="mb-4">${msg}</p><div class="flex justify-end gap-2"><button class="${G}" data-a="x">Cancelar</button><button id="ok" class="bg-red-600 text-white rounded px-3 py-2 text-sm">Excluir</button></div>`);
  $('#ok').onclick = () => {
    try { fn(); modal(); toast(ok); } catch { toast('Erro ao processar.', 0); }
  };
};

/* TABELAS E FORMATAÇÕES */
const fmt = (col, r, k, id) => {
  const v = r[k], f = fl(col, k);
  if (k === 'id') return esc(id.slice(-6));
  if (k === 'checklist') {
    return `<button class="text-brand font-medium underline inline-flex items-center gap-1" data-a="chkexp" data-i="${id}">${svg('clip', 'w-3.5 h-3.5')} Checklist (Ver mais)</button>`;
  }
  if (k === 'fotoNota') {
    return v ? `<button class="text-blue-600 font-medium underline" data-a="verfoto" data-i="${id}">Ver Foto</button>` : '—';
  }
  if (k === 'idLojas' && v) {
    const ids = String(v).split(', ');
    return esc(ids.map(idLoja => D.lojas?.[idLoja]?.nomeLoja || '').filter(Boolean).join(', ') || v);
  }
  if (k === 'dataHoraSaida' || k === 'dataHoraChegada') return v ? new Date(v).toLocaleString('pt-BR') : '—';
  if ((f[2] || '').startsWith('ref:')) return esc(nm(f[2].slice(4), v));
  if (k === 'validadeCnh' && v) {
    const d = Math.ceil((new Date(v) - new Date().setHours(0,0,0,0)) / 864e5);
    return dt(v) + ' ' + (d < 0 ? badge('Crítico', 'Vencida') : d <= 30 ? badge('Atenção', 'Vence em ' + d + 'd') : '');
  }
  if (f[2] === 'date') return dt(v);
  if (k === 'dataHora' && v) return new Date(v).toLocaleString('pt-BR');
  if (k === 'valor') return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  if (k === 'cotacao') return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  if (k === 'qtdAtencao') return v ? badge('Atenção', v) : '0';
  if (k === 'qtdCritico') return v ? badge('Crítico', v) : '0';
  if (BC[v]) return badge(v);
  return esc(v ?? '—');
};

const stK = col => ['status', 'statusManutencao', 'statusExpedicao'].find(k => E[col].c.includes(k));

const corpo = col => {
  const q = (F[col + 'q'] || '').toLowerCase(), s = F[col + 's'] || '', sk = stK(col);
  const rows = Object.entries(D[col] || {}).sort((a, b) => (b[1].criadoEm || b[1].dataHoraSaida || 0) - (a[1].criadoEm || a[1].dataHoraSaida || 0)).filter(([i, r]) => (!s || r[sk] === s) && E[col].c.map(k => fmt(col, r, k, i)).join(' ').replace(/<[^>]+>/g, '').toLowerCase().includes(q));
  if (!rows.length) return `<tr><td colspan="10" class="p-6 text-center text-gray-400">Nenhum registro encontrado.</td></tr>`;
  
  return rows.map(([i, r]) => {
    const tone = col === 'inspecoes' ? (r.qtdCritico ? 'bg-red-50' : r.qtdAtencao ? 'bg-yellow-50' : '') : '';
    const mainRow = `<tr class="border-t ${tone}">${E[col].c.map(k => `<td class="px-4 py-3">${fmt(col, r, k, i)}</td>`).join('')}<td class="px-4 py-3 whitespace-nowrap text-right">${col === 'expedicoes' && r.statusExpedicao === 'Em rota' ? `<button class="text-brand mr-2" data-a="fim" data-i="${i}">Finalizar</button>` : ''}<button class="text-blue-700 mr-2" data-a="edit" data-c="${col}" data-i="${i}">Editar</button><button class="text-red-600" data-a="del" data-c="${col}" data-i="${i}">Excluir</button></td></tr>`;
    
    if (col === 'inspecoes') {
      const chkItems = IN.map(k => `<div class="flex justify-between items-center text-xs border-b py-1"><span class="text-gray-600">${hum(k)}</span><span>${badge(r[k] || 'OK')}</span></div>`).join('');
      const expRow = `<tr id="chk_${i}" class="hidden bg-gray-50/80"><td colspan="${E[col].c.length + 1}" class="p-4 border-b"><div class="bg-white border rounded-xl p-4 max-w-2xl shadow-sm"><div class="font-semibold text-xs uppercase text-gray-500 mb-2">Checklist de Inspeção do Veículo</div><div class="grid sm:grid-cols-2 gap-x-6 gap-y-1">${chkItems}</div></div></td></tr>`;
      return mainRow + expRow;
    }
    return mainRow;
  }).join('');
};

const bars = o => {
  const m = Math.max(1, ...Object.values(o));
  return Object.entries(o).map(([k, v]) => `<div class="flex items-center gap-2 text-xs mb-1"><span class="w-32 truncate">${esc(k)}</span><div class="flex-1 bg-gray-100 rounded h-3"><div class="bg-brand h-3 rounded" style="width:${v / m * 100}%"></div></div><span>${v}</span></div>`).join('') || '<p class="text-xs text-gray-400">Sem dados.</p>';
};

const ci = l => /KM/i.test(l) ? 'gauge' : /Expedi/.test(l) ? 'pkg' : /uso/.test(l) ? 'truck' : /dispon/.test(l) ? 'check' : /manuten/i.test(l) ? 'wrench' : /Motorista/.test(l) ? 'user' : /crític/.test(l) ? 'alert' : /gasto/i.test(l) ? 'dollar' : /abastec/i.test(l) ? 'fuel' : 'grid';
const card = (l, v) => `<div class="relative bg-white border border-gray-100 rounded-2xl p-5 pl-6 shadow-sm overflow-hidden"><span class="absolute left-0 top-0 bottom-0 w-1.5 bg-brand"></span><div class="flex justify-between items-start gap-2"><span class="text-sm text-gray-500 font-medium">${l}</span><span class="text-brand">${svg(ci(l))}</span></div><div class="text-3xl font-bold mt-3 tracking-tight">${v}</div></div>`;

const lista = col => {
  const E1 = E[col], sk = stK(col), vals = [...new Set(Object.values(D[col] || {}).map(r => r[sk]).filter(Boolean))];
  let extra = '';
  if (col === 'manutencoes') {
    const ms = Object.values(D.manutencoes || {}), g = {};
    ms.forEach(m => g[nm('veiculos', m.idVeiculo)] = (g[nm('veiculos', m.idVeiculo)] || 0) + Number(m.valor || 0));
    extra = `<div class="grid sm:grid-cols-3 gap-3 mb-4">${card('Total gasto', 'R$ ' + ms.reduce((a, m) => a + Number(m.valor || 0), 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 }))}${card('Manutenções', ms.length)}${card('Em manutenção agora', ms.filter(m => m.statusManutencao === 'Aberta').length)}</div><div class="bg-white border rounded-2xl p-4 mb-4"><div class="text-sm font-medium mb-2">Gasto por veículo (R$)</div>${bars(g)}</div>`;
  }
  if (col === 'abastecimentos') {
    const abs = Object.values(D.abastecimentos || {}), totLitros = abs.reduce((a, b) => a + Number(b.litros || 0), 0), totValor = abs.reduce((a, b) => a + Number(b.valor || 0), 0);
    extra = `<div class="grid sm:grid-cols-3 gap-3 mb-4">${card('Total gasto com combustíveis', 'R$ ' + totValor.toLocaleString('pt-BR', { minimumFractionDigits: 2 }))}${card('Total de litros', totLitros.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) + ' L')}${card('Abastecimentos', abs.length)}</div>`;
  }
  return `<div class="flex flex-wrap gap-2 items-center justify-between mb-4"><h2 class="text-2xl font-bold">${E1.t}</h2><div class="flex gap-2"><button class="${G}" data-a="rel" data-c="${col}">${svg('clip', 'w-4 h-4 inline -mt-0.5')} Gerar relatório</button><button class="${B}" data-a="new" data-c="${col}">${E1.n}</button></div></div>${extra}
<div class="flex gap-2 mb-3"><input id="q" placeholder="Pesquisar..." value="${esc(F[col + 'q'] || '')}" class="${IC} max-w-xs">${sk ? `<select id="s" class="${IC} max-w-[11rem]"><option value="">Todos os status</option>${vals.map(x => `<option ${x === F[col + 's'] ? 'selected' : ''}>${x}</option>`).join('')}</select>` : ''}</div>
<div class="bg-white border border-gray-200 rounded-2xl overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50 text-left text-xs text-gray-500 uppercase tracking-wide"><tr>${E1.c.map(k => `<th class="px-4 py-3 font-semibold">${LB[k] || fl(col, k)[1] || k}</th>`).join('')}<th></th></tr></thead><tbody id="tb">${corpo(col)}</tbody></table></div>`;
};

const dash = () => {
  const f = F.d || (F.d = {});
  const sel = (k, c, l) => `<select data-f="${k}" class="${IC}"><option value="">${l}</option>${Object.entries(D[c] || {}).map(([i, r]) => `<option value="${i}" ${f[k] === i ? 'selected' : ''}>${esc(LAB[c](r))}</option>`).join('')}</select>`;
  const ex = Object.values(D.expedicoes || {}).filter(e => {
    const d = new Date(e.dataHoraSaida).toLocaleDateString('sv');
    return (!f.de || d >= f.de) && (!f.ate || d <= f.ate) && (!f.m || e.idMotorista === f.m) && (!f.v || e.idVeiculo === f.v) && (!f.r || e.idRota === f.r) && (!f.s || e.statusExpedicao === f.s);
  });
  const vs = Object.values(D.veiculos || {}), cnt = s => vs.filter(v => v.status === s).length, ms = Object.values(D.motoristas || {});
  const cnhAl = ms.filter(m => m.status === 'Ativo' && m.validadeCnh && (new Date(m.validadeCnh) - Date.now()) / 864e5 <= 30).length;
  const gm = {}, gv = {}, gd = {}, gk = {};
  ex.forEach(e => {
    const d = new Date(e.dataHoraSaida).toLocaleDateString('pt-BR');
    gm[nm('motoristas', e.idMotorista)] = (gm[nm('motoristas', e.idMotorista)] || 0) + 1;
    gv[nm('veiculos', e.idVeiculo)] = (gv[nm('veiculos', e.idVeiculo)] || 0) + 1;
    gd[d] = (gd[d] || 0) + 1;
    gk[d] = (gk[d] || 0) + (e.kmRodado || 0);
  });
  const man = Object.values(D.manutencoes || {}), box = (t, b) => `<div class="bg-white border border-gray-200 rounded-2xl p-4"><div class="text-sm font-medium mb-2">${t}</div>${b}</div>`;
  return `<div class="flex flex-wrap justify-between items-end gap-2 mb-6"><div><h2 class="text-3xl font-bold">Olá, ${esc((me.nome || '').split(' ')[0])}!</h2><p class="text-gray-500">Resumo da sua operação em tempo real.</p></div><div class="flex gap-2 items-center"><button class="${G}" data-a="rel" data-c="dashboard">${svg('clip', 'w-4 h-4 inline -mt-0.5')} Relatório Geral</button><div class="text-right text-sm border-l pl-3"><div class="font-semibold">${new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' })}</div><div class="text-gray-400">Visão geral da operação</div></div></div></div>
<div class="grid grid-cols-2 lg:grid-cols-6 gap-2 mb-4 bg-white border border-gray-100 rounded-2xl p-4 shadow-sm"><input type="date" data-f="de" value="${f.de || ''}" class="${IC}"><input type="date" data-f="ate" value="${f.ate || ''}" class="${IC}">${sel('m', 'motoristas', 'Motorista')}${sel('v', 'veiculos', 'Veículo')}${sel('r', 'rotas', 'Rota')}<select data-f="s" class="${IC}"><option value="">Status</option><option ${f.s === 'Em rota' ? 'selected' : ''}>Em rota</option><option ${f.s === 'Finalizada' ? 'selected' : ''}>Finalizada</option></select></div>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${card('Expedições no período', ex.length)}${card('KM rodado no período', ex.reduce((a, e) => a + (e.kmRodado || 0), 0).toLocaleString('pt-BR'))}${card('Veículos em uso', cnt('Em uso'))}${card('Veículos disponíveis', cnt('Disponível'))}${card('Veículos em manutenção', cnt('Manutenção'))}${card('Motoristas ativos', ms.filter(m => m.status === 'Ativo').length)}${card('Inspeções com itens críticos', Object.values(D.inspecoes || {}).filter(i => i.qtdCritico > 0).length)}${card('Manutenções realizadas', man.length)}</div>
${cnhAl ? `<div class="mb-4 p-3 rounded bg-yellow-100 text-yellow-900 text-sm">${cnhAl} motorista(s) com CNH vencida ou vencendo em até 30 dias.</div>` : ''}
<div class="grid md:grid-cols-2 gap-3">${box('Expedições por período', bars(gd))}${box('Quilometragem por período', bars(gk))}${box('Expedições por motorista', bars(gm))}${box('Utilização da frota (expedições por veículo)', bars(gv))}${box('Distribuição de status dos veículos', bars({ 'Disponível': cnt('Disponível'), 'Em uso': cnt('Em uso'), 'Manutenção': cnt('Manutenção') }))}</div>`;
};

const det = (col, id) => {
  const r = D[col][id];
  const rows = E[col].f.filter(f => r[f[0]] !== undefined && r[f[0]] !== '').map(([k, l]) => {
    return `<div class="flex justify-between border-b py-1.5 text-sm"><span class="text-gray-600">${l}</span><span>${fmt(col, r, k, id)}</span></div>`;
  }).join('');
  modal(`<h3 class="text-lg font-semibold mb-3">Detalhes</h3>${rows}<div class="flex justify-end gap-2 mt-4"><button class="${G}" data-a="edit" data-c="${col}" data-i="${id}">Editar</button><button class="bg-red-600 text-white rounded px-3 py-2 text-sm" data-a="del" data-c="${col}" data-i="${id}">Excluir</button><button class="${B}" data-a="x">Fechar</button></div>`);
};

/* RELATÓRIOS DO SISTEMA */
let RL = null;
const relForm = col => {
  if (col === 'dashboard') {
    return relatorio('dashboard', F.d || {});
  }
  if (['motoristas', 'veiculos', 'lojas', 'rotas'].includes(col)) {
    return relatorio(col, {});
  }
  
  let extraFilters = '';
  if (col === 'expedicoes') {
    extraFilters = `<label class="text-sm"><span class="block mb-1 text-gray-600">Motorista</span>${inp(['idMotorista', 'Motorista', 'ref:motoristas'], '', { todos: 1 })}</label><label class="text-sm"><span class="block mb-1 text-gray-600">Rota</span>${inp(['idRota', 'Rota', 'ref:rotas'], '', { todos: 1 })}</label>`;
  } else if (col === 'manutencoes') {
    extraFilters = `<label class="text-sm"><span class="block mb-1 text-gray-600">Empresa</span><input name="empresa" class="${IC}"></label>`;
  } else if (col === 'abastecimentos') {
    extraFilters = `<label class="text-sm"><span class="block mb-1 text-gray-600">Veículo (Carro)</span>${inp(['idVeiculo', 'Veículo', 'ref:veiculos'], '', { todos: 1 })}</label><label class="text-sm"><span class="block mb-1 text-gray-600">Combustível</span>${inp(['combustivel', 'Combustível', 'sel', COMBUSTIVEIS], '')}</label>`;
  }
  
  modal(`<h3 class="text-lg font-semibold mb-4">Gerar relatório de ${E[col].t}</h3><form id="rf" class="grid sm:grid-cols-2 gap-3"><label class="text-sm"><span class="block mb-1 text-gray-600">Data inicial</span><input type="date" name="de" class="${IC}"></label><label class="text-sm"><span class="block mb-1 text-gray-600">Data final</span><input type="date" name="ate" class="${IC}"></label>${['expedicoes','manutencoes','inspecoes'].includes(col) ? `<label class="text-sm"><span class="block mb-1 text-gray-600">Veículo</span>${inp(['idVeiculo', 'Veículo', 'ref:veiculos'], '', { todos: 1 })}</label>` : ''}${extraFilters}<div class="sm:col-span-2 flex justify-end gap-2 pt-2"><button type="button" class="${G}" data-a="x">Cancelar</button><button class="${B}">Gerar relatório</button></div></form>`);
  $('#rf').onsubmit = e => {
    e.preventDefault();
    relatorio(col, Object.fromEntries(new FormData(e.target)));
  };
};

const relatorio = (col, f) => {
  const txt = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
  let title = '', h = [], rowsData = [], kv = [];

  if (col === 'dashboard') {
    title = 'Relatório Geral Operacional';
    h = ['Módulo', 'Total de Registros', 'Resumo Operacional'];
    
    const exAll = Object.values(D.expedicoes || {}).filter(e => {
      const d = new Date(e.dataHoraSaida).toLocaleDateString('sv');
      return (!f.de || d >= f.de) && (!f.ate || d <= f.ate) && (!f.m || e.idMotorista === f.m) && (!f.v || e.idVeiculo === f.v) && (!f.r || e.idRota === f.r) && (!f.s || e.statusExpedicao === f.s);
    });

    const exN = exAll.length;
    const mnN = Object.keys(D.manutencoes || {}).length;
    const insN = Object.keys(D.inspecoes || {}).length;
    const absN = Object.keys(D.abastecimentos || {}).length;
    const veN = Object.keys(D.veiculos || {}).length;
    const moN = Object.keys(D.motoristas || {}).length;
    
    kv = [['Veículos Cadastrados', veN], ['Motoristas Ativos', Object.values(D.motoristas || {}).filter(m=>m.status==='Ativo').length], ['Expedições (Filtradas)', exN], ['Abastecimentos', absN]];
    rowsData = [
      ['Motoristas', moN, `${Object.values(D.motoristas||{}).filter(m=>m.status==='Ativo').length} ativos`],
      ['Veículos', veN, `${Object.values(D.veiculos||{}).filter(v=>v.status==='Disponível').length} disponíveis, ${Object.values(D.veiculos||{}).filter(v=>v.status==='Em uso').length} em uso`],
      ['Rotas', Object.keys(D.rotas||{}).length, 'Rotas operacionais ativas'],
      ['Expedições', exN, `${exAll.filter(e=>e.statusExpedicao==='Finalizada').length} finalizadas, KM total: ${exAll.reduce((a,e)=>a+(e.kmRodado||0),0)}`],
      ['Abastecimentos', absN, `Total gasto: R$ ${Object.values(D.abastecimentos||{}).reduce((a,b)=>a+Number(b.valor||0),0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`],
      ['Inspeções', insN, `${Object.values(D.inspecoes||{}).filter(i=>i.qtdCritico>0).length} com alertas críticos`],
      ['Manutenções', mnN, `Total gasto: R$ ${Object.values(D.manutencoes||{}).reduce((a,m)=>a+Number(m.valor||0),0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`]
    ];
  } else {
    title = `Relatório de ${E[col].t}`;
    const ks = E[col].c.filter(k => k !== 'checklist' && k !== 'fotoNota');
    h = ks.map(k => LB[k] || fl(col, k)[1] || k);
    
    const rawRows = Object.entries(D[col] || {}).filter(([i, r]) => {
      const d = r.data || r.dataHora || (r.dataHoraSaida ? new Date(r.dataHoraSaida).toLocaleDateString('sv') : '');
      return (!f.de || !d || d >= f.de) && (!f.ate || !d || d <= f.ate) && (!f.idVeiculo || r.idVeiculo === f.idVeiculo) && (!f.combustivel || r.combustivel === f.combustivel);
    });
    
    kv = [['Total de Registros', rawRows.length]];
    if (col === 'abastecimentos') {
      const totV = rawRows.reduce((a, [,r]) => a + Number(r.valor || 0), 0);
      const totL = rawRows.reduce((a, [,r]) => a + Number(r.litros || 0), 0);
      kv.push(['Valor Total', 'R$ ' + totV.toLocaleString('pt-BR', { minimumFractionDigits: 2 })]);
      kv.push(['Litros Totais', totL.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) + ' L']);
    }
    rowsData = rawRows.map(([i, r]) => ks.map(k => txt(fmt(col, r, k, i))));
  }

  RL = { col, h, d: rowsData };
  
  $('#rel').innerHTML = `<div class="max-w-5xl mx-auto">
    <div class="noprint flex flex-wrap gap-2 justify-end mb-4">
      <button class="${G}" data-a="rx">Fechar</button>
      <button class="${G}" data-a="rcsv">Baixar Excel (CSV)</button>
      <button class="${B}" data-a="rprint">Imprimir / Salvar em PDF</button>
    </div>
    <div class="flex justify-between items-start border-b pb-3 mb-4">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="text-brand">${svg('logo', 'w-8 h-6')}</span>
          <span class="font-bold text-gray-800">Frotas & Expedições</span>
        </div>
        <h1 class="text-2xl font-bold">${title}</h1>
        <p class="text-sm text-gray-500">${f.de ? `Período: ${dt(f.de)} a ${f.ate ? dt(f.ate) : 'Hoje'}` : 'Listagem Geral Completa'}</p>
      </div>
      <div class="text-sm text-gray-500 text-right">Gerado em<br>${new Date().toLocaleString('pt-BR')}</div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">${kv.map(([l, v]) => `<div class="border rounded-xl p-3"><div class="text-xs text-gray-500">${l}</div><div class="text-xl font-bold">${v}</div></div>`).join('')}</div>
    <div class="overflow-x-auto"><table class="w-full text-sm border"><thead class="bg-gray-50 text-left text-xs text-gray-500 uppercase"><tr>${h.map(x => `<th class="px-3 py-2 border-b">${x}</th>`).join('')}</tr></thead><tbody>${rowsData.length ? rowsData.map(r => `<tr class="border-t">${r.map(c => `<td class="px-3 py-2 border-b">${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${h.length}" class="p-6 text-center text-gray-400">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>
  </div>`;
  modal();
  $('#rel').classList.remove('hidden');
  document.body.classList.add('pr');
};

const csv = () => {
  const q = x => `"${String(x).replace(/"/g, '""')}"`;
  const t = '\ufeff' + [RL.h, ...RL.d].map(l => l.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' }));
  a.download = `relatorio-${RL.col}-${new Date().toLocaleDateString('sv')}.csv`;
  a.click();
};

/* MANIPULADOR DE EVENTOS GLOBAL */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const { a, c, i } = b.dataset;

  if (a === 'rel') return relForm(c);
  if (a === 'rx') { $('#rel').classList.add('hidden'); document.body.classList.remove('pr'); return; }
  if (a === 'rprint') return window.print();
  if (a === 'rcsv') return csv();
  if (a === 'x') return modal();
  if (a === 'nav') { view = i; $('#side').classList.add('hidden'); return render(); }
  if (a === 'menu') return $('#side').classList.toggle('hidden');
  if (a === 'resetdb') {
    if (confirm("Deseja restaurar os dados fictícios originais da demonstração?")) {
      localStorage.removeItem('frotas_demo_db');
      D = loadDB();
      render();
      toast('Dados fictícios restaurados!');
    }
    return;
  }
  if (a === 'new') return c === 'expedicoes' ? novaExp() : form(c, null, E[c].f.map(f => f[0]), E[c].n);
  if (a === 'edit') return form(c, i, E[c].f.map(f => f[0]), 'Editar registro');
  if (a === 'det') return det(c, i);
  if (a === 'fim') return fim(i);
  if (a === 'chkexp') {
    const el = $(`#chk_${i}`);
    if (el) el.classList.toggle('hidden');
    return;
  }
  if (a === 'verfoto') {
    const m = D.manutencoes[i];
    modal(`<h3 class="text-lg font-semibold mb-3">Comprovante de Nota Fiscal</h3><div class="mb-4 overflow-auto max-h-[70vh] flex justify-center">${m.fotoNota ? `<img src="${m.fotoNota}" class="max-w-full rounded shadow">` : '<p class="text-gray-400">Sem imagem anexada.</p>'}</div><div class="flex justify-end"><button class="${B}" data-a="x">Fechar</button></div>`);
    return;
  }
  if (a === 'del') {
    const r = D[c][i];
    return conf('Tem certeza de que deseja excluir este registro? Esta ação não poderá ser desfeita.', () => {
      delete D[c][i];
      if (c === 'expedicoes' || c === 'manutencoes') recalc(r.idVeiculo);
      saveDB();
    }, 'Registro excluído.');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q' || e.target.id === 's') {
    const col = MENU.find(m => m[0] === view)[1];
    F[col + e.target.id] = e.target.value;
    $('#tb').innerHTML = corpo(col);
  }
});

document.addEventListener('change', e => {
  const k = e.target.dataset.f;
  if (k) { F.d[k] = e.target.value; render(); }
});

/* ESTRUTURA E RENDERIZAÇÃO */
const render = () => {
  if (!$('#main')) return;
  const nv = $('#nav');
  if (nv) nv.innerHTML = navHtml();
  const col = (MENU.find(m => m[0] === view) || [])[1];
  $('#main').innerHTML = view === 'Dashboard' ? dash() : lista(col);
};

const navHtml = () => MENU.map(([l, , i]) => `<a href="#" data-a="nav" data-i="${l}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all ${l === view ? 'bg-brand text-white shadow-lg shadow-orange-200' : 'text-gray-600 hover:bg-gray-100'}">${svg(i)}${l}</a>`).join('');

const shell = () => {
  $('#app').innerHTML = `<div class="md:flex min-h-screen">
    <div class="md:hidden bg-white border-b p-3 flex justify-between items-center">
      <span class="flex items-center gap-2 font-bold">
        <span class="text-brand">${svg('logo', 'w-7 h-5')}</span>
        <div>
          <div class="text-sm leading-none">Frotas & Expedições</div>
          <div class="text-[10px] text-gray-500 font-normal">gestão operacional</div>
        </div>
      </span>
      <button data-a="menu" class="p-2">${svg('menu')}</button>
    </div>
    <aside id="side" class="hidden md:flex flex-col w-full md:w-64 shrink-0 bg-white border-r border-gray-100 md:sticky md:top-0 md:h-screen">
      <div class="hidden md:flex items-center gap-3 p-5 border-b border-gray-100">
        <span class="text-brand">${svg('logo', 'w-10 h-8')}</span>
        <div class="leading-tight">
          <div class="font-bold text-gray-900 leading-none mb-0.5">Frotas & Expedições</div>
          <div class="text-xs text-gray-500 font-medium tracking-wide uppercase">gestão operacional</div>
        </div>
      </div>
      <nav id="nav" class="flex-1 p-3 space-y-1 overflow-y-auto">${navHtml()}</nav>
      <div class="p-4 border-t border-gray-100 space-y-3">
        <div class="flex items-center gap-3">
          <span class="w-10 h-10 rounded-full bg-orange-100 text-brand flex items-center justify-center font-bold">D</span>
          <div class="leading-tight min-w-0">
            <div class="font-semibold truncate">Modo Demonstração</div>
            <div class="text-xs text-gray-500">Coordenador</div>
          </div>
        </div>
        <button data-a="resetdb" class="w-full text-xs text-gray-500 hover:text-brand underline text-center block">Restaurar Dados Iniciais</button>
      </div>
    </aside>
    <main id="main" class="flex-1 p-4 md:p-8 min-w-0"></main>
  </div>`;
  render();
};

/* INICIALIZAÇÃO DIRETA */
shell();
</script>
</body>
</html>
